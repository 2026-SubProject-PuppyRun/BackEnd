services:

  mysql:
    image: mysql:8.0
    container_name: puppyrun-mysql
    restart: "no"

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    ports:
      - "${DB_PORT}:3306"

    volumes:
      - mysql_data:/var/lib/mysql


  rabbitmq:
    image: rabbitmq:3-management
    container_name: puppyrun-rabbitmq
    restart: "no"

    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}


  backend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/puppyrun-backend:${IMAGE_TAG}

    container_name: puppyrun-backend

    restart: "no"

    depends_on:
      - mysql
      - rabbitmq

    ports:
      - "${BACKEND_PORT}:8080"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}

    env_file:
      - .env-backend


volumes:
  mysql_data:
