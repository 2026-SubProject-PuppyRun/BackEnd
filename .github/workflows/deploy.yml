name: Deploy to EC2

on:
  push:
    branches: [dev, cd-test]
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포할 불변 ECR 이미지 태그 (예: Git SHA)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: puppyrun-production-deploy
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: github.event_name == 'push'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build jar
        if: github.event_name == 'push'
        run: ./gradlew clean bootJar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push immutable Docker image
        if: github.event_name == 'push'
        run: |
          docker build -t puppyrun-backend:latest .
          docker tag puppyrun-backend:latest \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/puppyrun-backend:${{ github.sha }}
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/puppyrun-backend:${{ github.sha }}

      # S3를 거치지 않고 SSM으로 안전한 배포 파일을 EC2 new 폴더에 전달한다.
      - name: Create candidate release and deploy on EC2
        id: ssm_deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          DEPLOY_IMAGE_TAG: ${{ github.event_name == 'push' && github.sha || github.event.inputs.image_tag }}
          RELEASE_BUNDLE_DIRECTORY: .github/workflows/deployment
        run: bash .github/workflows/github-actions/send-ssm-command.sh

      - name: Wait for EC2 deployment
        env:
          COMMAND_ID: ${{ steps.ssm_deploy.outputs.command_id }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: bash .github/workflows/github-actions/wait-for-ssm-command.sh

      - name: Show failed EC2 deployment details
        if: failure() && steps.ssm_deploy.outputs.command_id != ''
        env:
          COMMAND_ID: ${{ steps.ssm_deploy.outputs.command_id }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: bash .github/workflows/github-actions/show-ssm-command-result.sh
