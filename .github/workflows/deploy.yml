name: Deploy to EC2

on:
  push:
    branches: [dev, cd-test]
    paths:
      - 'src/main/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'Dockerfile'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포할 불변 ECR 이미지 태그 (예: Git SHA)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: puppyrun-production-deploy
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: github.event_name == 'push'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build jar
        if: github.event_name == 'push'
        run: ./gradlew clean bootJar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push immutable Docker image
        if: github.event_name == 'push'
        run: |
          docker build -t puppyrun-backend:latest .
          docker tag puppyrun-backend:latest \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/puppyrun-backend:${{ github.sha }}
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/puppyrun-backend:${{ github.sha }}

      # SSM에는 EC2에 고정 설치된 deploy.sh 실행 요청만 전달한다.
      - name: Trigger EC2 deployment
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DEPLOY_IMAGE_TAG: ${{ github.event_name == 'push' && github.sha || github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          printf -v quoted_image_tag '%q' "$DEPLOY_IMAGE_TAG"
          command="/home/ubuntu/puppyrun/scripts/deploy.sh $quoted_image_tag"
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Puppyrun $DEPLOY_IMAGE_TAG" \
            --parameters "commands=$(jq -n --arg command "$command" '[ $command ]')" \
            --query 'Command.CommandId' \
            --output text