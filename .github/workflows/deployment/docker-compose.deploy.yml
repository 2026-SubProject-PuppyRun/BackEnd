services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: puppyrun-rabbitmq
    restart: "unless-stopped"

    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}


  backend:
    image: ${BACKEND_IMAGE}

    restart: "unless-stopped"

    ports:
      - "${BACKEND_PORT}:8080"
      - "127.0.0.1:8081:8081"

    volumes:
      - backend_data:/var/lib/backend
      # Firebase 서비스 계정은 EC2에만 보관하고 컨테이너에는 읽기 전용으로 주입한다.
      - /home/ubuntu/puppyrun/config/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}

    env_file:
      - /home/ubuntu/puppyrun/config/app.env

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"




volumes:
  backend_data:
