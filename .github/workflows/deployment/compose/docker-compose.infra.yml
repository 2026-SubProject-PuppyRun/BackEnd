services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app

  alloy:
    # Grafana Alloy의 버전을 고정해 관측 인프라의 의도치 않은 변경을 막는다.
    image: grafana/alloy:v1.8.3
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL}
      GRAFANA_CLOUD_PROMETHEUS_USERNAME: ${GRAFANA_CLOUD_PROMETHEUS_USERNAME}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
    volumes:
      - /home/ubuntu/puppyrun/compose/config.alloy:/etc/alloy/config.alloy:ro
      # EC2 CPU, memory, disk metric 수집용 host filesystem mount다.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - observability
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  rabbitmq_data:

networks:
  app:
    external: true
    name: puppyrun-app
  observability:
    external: true
    name: puppyrun-observability
