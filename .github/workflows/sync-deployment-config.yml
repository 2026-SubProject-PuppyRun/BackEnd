name: Sync deployment configuration to EC2

on:
  push:
    branches: [dev, cd-test]
    paths:
      - '.github/workflows/deployment/compose/**'
      - '.github/workflows/deployment/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-restart:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: puppyrun-production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publish EC2 deployment branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git read-tree --empty
          git read-tree --prefix=compose/ HEAD:.github/workflows/deployment/compose
          git read-tree --prefix=scripts/ HEAD:.github/workflows/deployment/scripts

          tree=$(git write-tree)
          commit=$(printf 'Sync deployment configuration from %s\n' "$GITHUB_SHA" | git commit-tree "$tree")
          git push origin "$commit:refs/heads/ec2-deployment" --force

      - name: Pull deployment branch and restart services
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DEPLOY_ROOT: puppyrun
        run: |
          set -euo pipefail
          : "${DEPLOY_ROOT:?DEPLOY_ROOT is required.}"
          printf -v quoted_root '%q' "$DEPLOY_ROOT"
          command=$(cat <<'EOF'
          set -euo pipefail
          ROOT=__DEPLOY_ROOT__
          REPOSITORY_URL="https://github.com/${{ github.repository }}.git"
          BRANCH=ec2-deployment

          mkdir -p "$ROOT"
          if [[ ! -d "$ROOT/.git" ]]; then
            git -C "$ROOT" init
            git -C "$ROOT" remote add origin "$REPOSITORY_URL"
          else
            git -C "$ROOT" remote set-url origin "$REPOSITORY_URL"
          fi
          git -C "$ROOT" fetch --depth=1 origin "$BRANCH"
          git -C "$ROOT" checkout --force -B "$BRANCH" "origin/$BRANCH"
          git -C "$ROOT" reset --hard "origin/$BRANCH"

          docker network inspect puppyrun-app >/dev/null 2>&1 || docker network create puppyrun-app >/dev/null
          docker network inspect puppyrun-observability >/dev/null 2>&1 || docker network create puppyrun-observability >/dev/null
          bash "$ROOT/scripts/infra.sh" up
          bash "$ROOT/scripts/infra.sh" restart
          bash "$ROOT/scripts/apply-config.sh"
          EOF
          )
          command="${command/__DEPLOY_ROOT__/$quoted_root}"
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Pull and restart Puppyrun deployment configuration" \
            --parameters "commands=$(jq -n --arg command "$command" '[ $command ]')" \
            --query 'Command.CommandId' \
            --output text)

          for attempt in {1..60}; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Pending|InProgress|Delayed|'') sleep 10 ;;
              *)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for SSM command: $command_id"
          exit 1
