app:
  base-url: http://localhost:8080 # 로컬 호스트

# JWT 설정 (토큰 만료 시간을 초 단위로 설정)
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_VALIDITY:900000}    # 15분 (900밀리초)
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_VALIDITY:1209600000} # 14일 (1209600밀리초)

spring:
  devtools:
    restart:
      enabled: false  # DevTools 자동 재시작 비활성화 → 매 실행마다 JVM 완전 재기동으로 Docker Compose 지원 정상 동작

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_REGION}
      s3:
        bucket: ${AWS_S3_BUCKET_NAME}
      stack:
        auto: false
weather:
  region-path: config/weather-regions.csv
  initialize-on-startup: true
  retry:
    api:
      ttl: 600000 # 10분 (600,000ms)
    db:
      ttl: 10000  # 10초 (10,000ms)
