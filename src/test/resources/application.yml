spring:
  profiles:
    active: test

  application:
    name: PuppyRun

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  cloud:
    aws:
      credentials:
        access-key: AWS_ACCESS_KEY_ID
        secret-key: AWS_SECRET_ACCESS_KEY
      region:
        static: aws-global
      s3:
        bucket: AWS_S3_BUCKET_NAME
      stack:
        auto: false

  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  base-url: http://localhost:8080

jwt:
  secret: this-is-a-very-long-dummy-secret-key-for-test-only-do-not-use-real-key
  access-token-expiration: 900000
  refresh-token-expiration: 1209600000

discord:
  webhooks-url: https://discord.com/api/webhooks/dummy-url-for-test

data-kr:
  api-key: api-key
  forecast-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0

weather:
  region-path: config/weather-regions.csv
  initialize-on-startup: false
  retry:
    api:
      ttl: 1s   # 1초 (ms) — 통합 테스트 전용 단축 지연
    db:
      ttl: 1s   # 1초 (ms)

social-oauth2:
  google:
    client-id: google-client-id
    client-secret: google-client-secret
  kakao:
    client-id: kakao-client-id
    client-secret: kakao-client-secret



logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema: DEBUG
